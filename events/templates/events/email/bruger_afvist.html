{% load i18n %}<!DOCTYPE html>
<html lang="da">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;padding:20px;background:#f0f2f5;font-family:Arial,Helvetica,sans-serif;">
<table cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width:580px;margin:0 auto;">
<tr><td style="background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1);">

  <!-- Header -->
  <table cellpadding="0" cellspacing="0" border="0" width="100%">
  <tr><td style="background:#6c757d;padding:28px 32px;text-align:center;">
    <h1 style="margin:0;color:#fff;font-size:20px;">{% trans "Din anmodning er ikke godkendt" %}</h1>
  </td></tr>
  </table>

  <!-- Body -->
  <table cellpadding="0" cellspacing="0" border="0" width="100%" style="padding:0 32px;">
  <tr><td style="padding:28px 0;text-align:center;">
    <p style="margin:0;font-size:15px;color:#212529;line-height:1.6;">
      {% trans "Hej" %} <strong>{{ navn }}</strong>,<br><br>
      {% trans "din anmodning om adgang til Vibe Invite er desværre ikke godkendt." %}
    </p>
    <p style="margin:16px 0 0;font-size:14px;color:#6c757d;line-height:1.6;">
      {% trans "Kontakt administratoren, hvis du mener dette er en fejl." %}
    </p>
  </td></tr>
  </table>

  <!-- Footer -->
  <table cellpadding="0" cellspacing="0" border="0" width="100%">
  <tr><td style="background:#f8f9fa;padding:14px 32px;border-top:1px solid #dee2e6;text-align:center;">
    <p style="margin:0;font-size:12px;color:#6c757d;">{% trans "Vibe Invite · automatisk besked" %}</p>
  </td></tr>
  </table>

</td></tr>
</table>
</body>
</html>
